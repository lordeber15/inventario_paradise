server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (never append): nginx is the trusted edge here, and the
    # backend trusts X-Forwarded-For from any peer (see --forwarded-allow-ips
    # in backend/Dockerfile) since it's only reachable via this proxy or
    # localhost. $proxy_add_x_forwarded_for would instead APPEND to whatever
    # X-Forwarded-For a client sends, letting anyone spoof their rate-limit
    # bucket by prepending a fake value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # More specific prefix wins over /api/ below: product-photo uploads (up to
    # 6 files) can legitimately exceed the default 10m cap. Kept as its own
    # block instead of raising the limit for the whole API, since every other
    # route (starting with unauthenticated /api/auth/login) should keep the
    # tight cap. Matches UPLOAD_MAX_BODY_SIZE_BYTES in backend/app/main.py.
    location /api/admin/products {
        proxy_pass http://backend:8000/api/admin/products;
        client_max_body_size 52m;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        client_max_body_size 10m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fotos de producto y logo, servidas por el mismo origen que la app en vez
    # de una URL absoluta a MinIO. Antes el backend devolvía
    # http://localhost:9000/... en cada image_url, así que desde un celular de
    # la red "localhost" era el propio celular y no cargaba ninguna foto. Con
    # esta ruta relativa la app funciona igual desde localhost, desde la IP de
    # la LAN o desde un dominio futuro, sin configurar nada — el mismo criterio
    # que /api/ de acá abajo. La barra final de proxy_pass es la que reescribe
    # /media/product-images/x → /product-images/x.
    location /media/ {
        proxy_pass http://minio:9000/;
        # Los objetos se nombran con UUID y nunca cambian de contenido: al
        # reemplazar una foto se sube una clave nueva y se borra la vieja.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
